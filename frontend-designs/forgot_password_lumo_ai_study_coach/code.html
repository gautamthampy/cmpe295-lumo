<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Reset Your Password | Academic Portal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "secondary": "#39693b",
              "tertiary": "#56482e",
              "on-tertiary-fixed-variant": "#53452b",
              "inverse-primary": "#acc7ff",
              "on-tertiary-container": "#f1dbb8",
              "primary-fixed": "#d7e2ff",
              "surface-container": "#f1ede6",
              "error-container": "#ffdad6",
              "surface-variant": "#e6e2db",
              "on-secondary-fixed-variant": "#215025",
              "error": "#ba1a1a",
              "tertiary-fixed-dim": "#d8c4a2",
              "tertiary-container": "#6f6044",
              "surface-container-low": "#f7f3ec",
              "surface-tint": "#335da4",
              "on-tertiary": "#ffffff",
              "on-tertiary-fixed": "#241a05",
              "primary": "#19498e",
              "on-secondary-fixed": "#002105",
              "surface-container-highest": "#e6e2db",
              "outline-variant": "#c3c6d2",
              "on-secondary-container": "#3e6d3e",
              "on-primary-fixed-variant": "#13458b",
              "surface-dim": "#dddad2",
              "secondary-container": "#b8edb3",
              "surface-container-lowest": "#ffffff",
              "secondary-fixed-dim": "#9fd49b",
              "inverse-surface": "#31302c",
              "on-primary-fixed": "#001a40",
              "on-primary-container": "#d1deff",
              "on-surface-variant": "#434751",
              "on-surface": "#1c1c17",
              "on-error-container": "#93000a",
              "primary-fixed-dim": "#acc7ff",
              "surface": "#fdf9f1",
              "on-primary": "#ffffff",
              "on-error": "#ffffff",
              "outline": "#737782",
              "surface-bright": "#fdf9f1",
              "on-secondary": "#ffffff",
              "primary-container": "#3761a8",
              "tertiary-fixed": "#f5e0bc",
              "background": "#fdf9f1",
              "secondary-fixed": "#baf0b6",
              "surface-container-high": "#ece8e0",
              "on-background": "#1c1c17",
              "inverse-on-surface": "#f4f0e9"
            },
            fontFamily: {
              "headline": ["Manrope"],
              "body": ["Plus Jakarta Sans"],
              "label": ["Plus Jakarta Sans"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
      }
      h1, h2, h3 {
        font-family: 'Manrope', sans-serif;
      }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- Header / TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#fdf9f1] dark:bg-slate-950/70 backdrop-blur-xl">
<div class="flex items-center justify-between px-8 py-4 max-w-7xl mx-auto">
<div class="text-2xl font-extrabold text-[#19498e] dark:text-[#3761a8] tracking-tighter font-manrope">LUMO:AI Study Coach</div>
<div class="hidden md:flex items-center gap-8">
<!-- Navigation is suppressed for transactional screens as per the Semantic Shell Mandate -->
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center px-8 pt-24 pb-12">
<div class="w-full max-w-md">
<!-- Auth Card -->
<div class="bg-surface-container-lowest rounded-xl p-10 transition-all duration-300">
<!-- Icon/Branding Element -->
<div class="flex justify-center mb-8">
<div class="w-16 h-16 rounded-full bg-surface-container-low flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-4xl" data-icon="lock_reset">lock_reset</span>
</div>
</div>
<!-- Title & Supportive Text -->
<div class="text-center mb-10">
<h1 class="text-3xl font-extrabold text-on-surface tracking-tight mb-3">Reset Your Password</h1>
<p class="text-on-surface-variant leading-relaxed font-body">
                        Enter the email address associated with your account and we will send you a link to reset your password.
                    </p>
</div>
<!-- Form Section -->
<form class="space-y-6">
<div>
<label class="block text-sm font-semibold text-on-surface-variant mb-2 px-1 font-label" for="email">
                            Email Address
                        </label>
<div class="relative group">
<input class="w-full px-4 py-4 bg-surface-container-highest border-none rounded-xl text-on-surface focus:ring-2 focus:ring-primary-fixed transition-all placeholder:text-outline font-body" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
<div class="absolute inset-y-0 right-4 flex items-center text-outline group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="mail">mail</span>
</div>
</div>
<p class="mt-3 text-xs text-tertiary flex items-center gap-2 px-1 font-body">
<span class="material-symbols-outlined text-sm" data-icon="info">info</span>
                            Link expires in 24 hours for security.
                        </p>
</div>
<!-- Action Buttons -->
<div class="pt-2">
<button class="w-full py-4 bg-gradient-to-br from-primary to-primary-container text-on-primary font-bold rounded-xl shadow-sm hover:shadow-md active:scale-[0.98] transition-all duration-150 flex items-center justify-center gap-2" type="submit">
                            Send Reset Link
                            <span class="material-symbols-outlined text-xl" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
<!-- Footer Navigation -->
<div class="mt-10 text-center">
<a class="inline-flex items-center gap-2 text-primary hover:text-primary-container font-semibold transition-colors duration-200 group" href="#">
<span class="material-symbols-outlined text-lg transition-transform group-hover:-translate-x-1" data-icon="arrow_back">arrow_back</span>
                        Back to Sign In
                    </a>
</div>
</div>
<!-- Supporting Decorative Elements (Abstract) -->
<div class="mt-12 grid grid-cols-3 gap-4 opacity-40">
<div class="h-1 bg-primary-fixed rounded-full"></div>
<div class="h-1 bg-secondary-fixed rounded-full"></div>
<div class="h-1 bg-tertiary-fixed rounded-full"></div>
</div>
</div>
</main>
<!-- Footer Component -->
<footer class="w-full py-12 px-8 bg-[#f7f3ec] dark:bg-slate-900 mt-auto">
<div class="flex flex-col md:flex-row justify-between items-center gap-6 w-full max-w-7xl mx-auto text-[#56482e] dark:text-slate-400 font-plus-jakarta text-sm leading-relaxed">
</div>
</footer>
</body></html>
