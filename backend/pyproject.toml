[project]
name = "lumo-parent-auth-backend"
version = "0.1.0"
description = "FastAPI auth service for the LUMO parent portal"
requires-python = ">=3.11"
dependencies = [
  "bcrypt>=5.0.0",
  "email-validator>=2.2.0",
  "fastapi>=0.115.12",
  "google-generativeai>=0.8.0",
  "httpx>=0.28.1",
  "passlib>=1.7.4",
  "python-jose>=3.5.0",
  "psycopg[binary]>=3.2.6",
  "pytest>=8.4.1",
  "pydantic-settings>=2.8.1",
  "redis>=5.2.1",
  "sqlalchemy>=2.0.39",
  "uvicorn[standard]>=0.34.0",
  "requests>=2.33.1",
  "locust>=2.43.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
