services:
  postgres:
    image: postgres:16-alpine
    container_name: lumo-postgres
    environment:
      POSTGRES_DB: lumo_auth
      POSTGRES_USER: lumo
      POSTGRES_PASSWORD: lumo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    container_name: lumo-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: lumo-minio
    environment:
      MINIO_ROOT_USER: lumo
      MINIO_ROOT_PASSWORD: lumo_dev_password
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
    container_name: lumo-backend
    environment:
      DATABASE_URL: postgresql+psycopg://lumo:lumo@postgres:5432/lumo_auth
      REDIS_URL: redis://redis:6379/0
      APP_BASE_URL: http://localhost:3000
      SESSION_COOKIE_NAME: lumo_session
      SESSION_COOKIE_SECURE: "false"
      MAIL_DELIVERY_MODE: log
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: lumo
      MINIO_SECRET_KEY: lumo_dev_password
      MINIO_BUCKET: lumo-content
    depends_on:
      - postgres
      - redis
      - minio
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: lumo-frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://backend:8000/api/v1
      SESSION_COOKIE_NAME: lumo_session
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  minio_data:
