services:
  postgres:
    image: postgres:16-alpine
    container_name: lumo-postgres
    environment:
      POSTGRES_DB: lumo_auth
      POSTGRES_USER: lumo
      POSTGRES_PASSWORD: lumo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    container_name: lumo-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
